# This is an operational review register, not a grant of rights or legal advice.
# New configured sources must have an explicit row here before registry tests pass.
policy:
  rights_review: pending
  provenance: source URL and configured connector type are recorded in sources.yaml
  storage: fetched source records and text can be persisted for processing; permission is not assessed
  public_display: source metadata, links, and short attributed excerpts may be shown; permission is not cleared
  commercial_reuse: not_cleared
  redistribution: not_cleared
  attribution: link to the originating publisher and article where available
