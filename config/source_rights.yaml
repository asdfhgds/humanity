  UCDP:
    group: ngo
    type: academic
    rights_review: reviewed
    terms_url: https://ucdp.uu.se/downloads/
    access_method: Public dataset downloads are available; versioned API access requires a token requested from the API maintainer (https://ucdp.uu.se/apidocs/); no HUMANITY adapter or token is configured.
    attribution_requirements: Attribute the UCDP GED dataset and cite the relevant UCDP publication; link the CC BY 4.0 license and identify changes.
    storage_retention_constraints: CC BY 4.0 permits copying and adaptation; API access is token-gated and requires a separate access request.
    display_rights: UCDP GED dataset records may be displayed with attribution; underlying source articles are not included in this clearance.
    commercial_use: allowed_with_attribution
    redistribution: allowed_with_attribution
    review_date: "2026-10-20"
    evidence_reference: https://ucdp.uu.se/downloads/
  ICRC: { group: ngo, type: ngo, rights_review: pending }
  GDELT GKG:
    group: data_provider
    type: data_provider
    rights_review: reviewed
    terms_url: https://www.gdeltproject.org/about.html#termsofuse
    access_method: Public GDELT datasets and APIs; this review covers GDELT data only, not linked article text or media.
    attribution_requirements: Cite the GDELT Project and link to https://www.gdeltproject.org/.
    storage_retention_constraints: GDELT terms permit unlimited use and redistribution of GDELT datasets.
    display_rights: GDELT dataset fields may be displayed; linked publisher article text and media are excluded.
    commercial_use: allowed
    redistribution: allowed_with_attribution
    review_date: "2026-10-20"
    evidence_reference: https://www.gdeltproject.org/about.html#termsofuse
  GDELT Events:
