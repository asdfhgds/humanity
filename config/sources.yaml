# HUMANITY Source Registry
# Each source must have a reason for inclusion

global_news:
  - name: "Reuters"
    url: "https://www.reuters.com/world/"
    type: "news"
    country: "global"
    language: "en"
    priority: 10
    poll_interval_hours: 1
    robots_policy: "allow"
    enabled: true
    reason: "Global wire service with extensive conflict coverage"

  - name: "Associated Press"
    url: "https://apnews.com/hub/world-news"
    type: "news"
    country: "global"
    language: "en"
    priority: 10
    poll_interval_hours: 1
    robots_policy: "allow"
    enabled: true
    reason: "Global wire service with extensive conflict coverage"

  - name: "BBC World"
