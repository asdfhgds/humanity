government:
  - name: "UN OCHA ReliefWeb"
    url: "https://reliefweb.int/updates"
    type: "un"
    country: "global"
    language: "en"
    priority: 10
    poll_interval_hours: 2
    robots_policy: "allow"
    enabled: true
    reason: "Primary humanitarian information source"
    roles: ["discovery", "evidence", "structured_data"]
    connector_type: "api"
    timeout_seconds: 60
    rate_limit_per_minute: 10
    rate_limit_per_hour: 200
    max_articles_per_fetch: 100
    fetch_full_content: true
    respect_robots_txt: true

  - name: "UNHCR Data"
    url: "https://data.unhcr.org/en/situations"
    type: "un"
    country: "global"
    language: "en"
    priority: 9
    poll_interval_hours: 6
    robots_policy: "allow"
    enabled: true
    reason: "Official refugee displacement data"

  - name: "WHO Emergencies"
    url: "https://www.who.int/emergencies"
    type: "un"
    country: "global"
    language: "en"
    priority: 8
    poll_interval_hours: 6
    robots_policy: "allow"
    enabled: true
    reason: "Health emergency updates"

ngo:
  - name: "ACLED"
    url: "https://acleddata.com/data/"
    type: "ngo"
    country: "global"
    language: "en"
    priority: 10
    poll_interval_hours: 24
    robots_policy: "allow"
    enabled: false
    reason: "Armed Conflict Location & Event Data - requires registration"

  - name: "UCDP"
    url: "https://ucdp.uu.se/downloads/"
    type: "academic"
    country: "global"
    language: "en"
    priority: 10
    poll_interval_hours: 168
    robots_policy: "allow"
    enabled: true
    reason: "Uppsala Conflict Data Program - authoritative conflict data"

  - name: "ICRC"
    url: "https://www.icrc.org/en/where-we-work"
    type: "ngo"
    country: "global"
    language: "en"
    priority: 8
    poll_interval_hours: 6
    robots_policy: "allow"
    enabled: true
    reason: "International Committee of the Red Cross"

data_provider:
  - name: "GDELT GKG"
    url: "http://data.gdeltproject.org/gkg/index.html"
