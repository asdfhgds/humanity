# HUMANITY Scoring Configuration
# Weights for the interestingness engine

weights:
  importance: 0.25
  human_impact: 0.20
  novelty: 0.15
  corroboration: 0.15
  velocity: 0.10
  public_interest: 0.10
  unusualness: 0.05

penalties:
  duplicate: 0.30
  low_confidence: 0.25
  single_source: 0.20
  old_event_hours: 0.15
  spam_indicators: 0.40

thresholds:
  auto_publish: 70
  auto_publish_warning: 55
  hold: 55
  min_confidence_for_publish: 0.6
  min_sources_for_auto_publish: 1
  min_sources_for_corroborated: 2

importance_factors:
  event_type_base:
    PROTEST: 40
    CONFLICT: 80
    ATTACK: 75
    CASUALTY: 70
    DISPLACEMENT: 55
    DISASTER: 60
    REPRESSION: 50
    HUMANITARIAN: 45

  severity_multiplier:
    1: 0.3
    2: 0.4
    3: 0.5
    4: 0.6
    5: 0.75
    6: 0.85
    7: 1.0
    8: 1.15
    9: 1.3
    10: 1.5

  geographic_significance:
    capital_city: 1.2
    major_city: 1.1
    border_region: 1.15
    conflict_zone: 1.25
    disputed_territory: 1.2

  human_impact_factors:
    deaths_per_event:
      0: 0
      1: 10
      2: 20
      3: 28
      4: 35
      5: 40
      10: 55
      25: 70
      50: 80
      100: 90
    injuries_multiplier: 0.5
    displacement_multiplier: 0.3
    arrests_multiplier: 0.2

  novelty_factors:
    first_event_in_country: 1.5
    first_event_type_in_region: 1.3
    escalation_from_previous: 1.4
    new_actor_involved: 1.2
    unusual_tactic: 1.25

  corroboration_factors:
    independent_sources:
      1: 0.5
      2: 0.75
      3: 0.9
      4: 1.0
      5: 1.0
    source_types:
      un: 1.3
      ngo: 1.2
      government: 1.0
      wire_service: 1.15
      news: 1.0
      academic: 1.1
      social: 0.6

  velocity_factors:
    articles_per_hour:
      0: 0
      1: 0.3
      3: 0.5
      5: 0.7
      10: 0.85
      20: 1.0

  public_interest_factors:
    social_media_velocity: 0.001
    search_trend_score: 0.002

  unusualness_factors:
    rare_event_type_in_country: 1.3
    anomaly_in_pattern: 1.2

score_caps:
  max_score: 100
  min_score: 0

daily_brief:
  max_items: 10
  min_score_for_inclusion: 60
  max_items_per_country: 3
  max_items_per_conflict: 4

overlooked_engine:
  min_importance: 65
  max_coverage_ratio: 0.3
  min_source_quality: 0.7
  enabled: true