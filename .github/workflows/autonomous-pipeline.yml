name: HUMANITY Autonomous Pipeline

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'Hours back for discovery'
        required: false
        default: '1'

concurrency:
  group: humanity-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover-and-publish:
    name: Discover & Publish Events
    if: vars.PRODUCTION_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-flash-latest' }}
      PRODUCTION_MODE: 'true'
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      MAX_ARTICLES_PER_RUN: '500'
      MAX_LLM_CALLS_PER_RUN: '25'
      MAX_SEARCH_CALLS_PER_RUN: ${{ vars.MAX_SEARCH_CALLS_PER_RUN || '50' }}
      MIN_PUBLISH_SCORE: ${{ vars.MIN_PUBLISH_SCORE || '70' }}
      MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE || '0.6' }}
      ENABLE_TAVILY: ${{ vars.ENABLE_TAVILY || 'false' }}
      ENABLE_AUTOPUBLISH: ${{ vars.ENABLE_AUTOPUBLISH || 'false' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Run Discovery Pipeline
        run: |
          python -m app.cli run --hours ${{ github.event.inputs.hours_back || '1' }}

      - name: Generate Daily Brief
        if: github.event.schedule == '0 2 * * *'
        run: |
          python -c "from app.publishing.publisher import EventPublisher; EventPublisher().generate_daily_brief()"

      - name: Persist validated state and generated public data
        run: |
          git config user.name "HUMANITY Bot"
          git config user.email "humanity-bot@users.noreply.github.com"
          git add -- data/ web/public/data/
          if [ -f data/.gemini-key-rotation.json ]; then
            git add -f -- data/.gemini-key-rotation.json
          fi
          git diff --staged --quiet || git commit -m "🤖 Persist ingestion state"
          git push

  health-check:
    name: Source Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 2 * * *'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run Health Check
        run: |
          python -m app.cli health

  cleanup:
    name: Weekly Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '0 3 * * 0'  # Weekly on Sunday

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run Cleanup
        run: |
          python -m app.cli run --cleanup-only
