name: Deploy public site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Explicitly confirm production deployment'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: humanity-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirm_deployment == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
